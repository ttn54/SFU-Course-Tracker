name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2
        timeout-minutes: 30
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              ubuntu@100.53.18.140 << 'DEPLOY_EOF'
            set -e
            if [ ! -d ~/SFU-Course-Tracker/.git ]; then
              rm -rf ~/SFU-Course-Tracker
              git clone https://github.com/ttn54/SFU-Course-Tracker.git ~/SFU-Course-Tracker
            fi

            cd ~/SFU-Course-Tracker
            git fetch origin
            git reset --hard origin/main
            git pull origin main

            docker compose down
            docker compose build
            docker compose up -d
          DEPLOY_EOF